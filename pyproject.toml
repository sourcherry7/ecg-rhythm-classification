[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-rhythm-classification"
version = "1.0.0"
description = "Heart rhythm classification from raw ECG recordings - ETH Zurich Advanced Machine Learning 2024, Task 2 (team Synapse Seekers, 62nd of 131)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Team Synapse Seekers (Paul M. Reisenberg, Stefan Visnjic, Raphael Baudeu)" }]
keywords = ["kaggle", "eth-zurich", "ecg", "heart-rhythm", "atrial-fibrillation", "neurokit2", "xgboost", "feature-engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "neurokit2>=0.2.10",
  "biosppy>=2.0",
  "peakutils>=1.3",  # imported by biosppy's ECG module but missing from its own dependency list
  "PyWavelets>=1.5",
  "joblib>=1.3",
  "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.4",
  "jupyter",
  "nbconvert",
  "ipykernel",
  "matplotlib>=3.7",
  "seaborn>=0.12",
]
kaggle = ["kaggle>=1.6"]

[project.urls]
Repository = "https://github.com/sourcherry7/ecg-rhythm-classification"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "needs_data: needs the private competition data under data/ (auto-skipped when absent, e.g. in CI)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
